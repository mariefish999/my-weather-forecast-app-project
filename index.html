<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My weather forecast app project</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="src/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/axios@1.13.2/dist/axios.min.js"></script>
  </head>
  <body>
    <div class="weather-app">
      <header>
        <form class="search-form" id="search-form">
          <input
            type="search"
            placeholder="Enter a city"
            required
            id="search-form-input"
            class="search-form-input"
          />
          <input type="submit" value="Search" class="search-form-button" />
        </form>
      </header>
      <main>
        <div class="weather-app-data">
          <div>
            <h1 class="weather-app-city" id="city">Paris</h1>
            <p class="weather-app-details">
              <span id="time"></span>,
              <span id="description"></span>
              <br />
              Humidity: <strong id="humidity"></strong>, Wind:
              <strong id="wind-speed"></strong>
            </p>
          </div>
          <div class="weather-app-container">
            <div id="icon" class="weather-app-icon"></div>
            <div class="weather-app-temperature-value" id="temperature">12</div>
            <div class="weather-app-unit">oC</div>
          </div>
        </div>
        <div class="weather-forecast" id="forecast"></div>
        
          </div>
        </div>
      </main>
      <footer>
        This project was coded by
        <a href="https://github.com/mariefish999" target="blank"
          >Marie Fisher
        </a>
        is open-sourced on
        <a
          href="https://github.com/mariefish999/my-weather-forecast-app-project"
          target="blank"
          >Github</a
        >
        and hosted on
        <a
          href="https://my-weather-forecast-app-project-mf.netlify.app/"
          target="blank"
          >Netlify</a
        >
      </footer>
    </div>
    <script src="src/javascript.js"></script>
  </body>
</html>
